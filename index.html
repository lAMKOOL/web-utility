<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Diagnostics Terminal</title>
    <style>
        body { font-family: 'Courier New', monospace; margin: 20px; background: #1e1e1e; color: #00ff00; }
        .container { max-width: 1000px; margin: 0 auto; background: #2d2d2d; padding: 20px; border-radius: 8px; border: 1px solid #444; }
        input[type="text"] { width: 65%; padding: 10px; background: #111; color: #00ff00; border: 1px solid #555; font-family: monospace; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        #output { width: 100%; height: 600px; background: #111; border: 1px solid #555; margin-top: 20px; padding: 10px; overflow-y: scroll; white-space: pre-wrap; font-size: 13px; color: #fff; }
        .status { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>System Terminal Layout Reader</h2>
        <p>Target Node Address:</p>
        <input type="text" id="urlInput" value="https://eldorado.gg">
        <button onclick="fetchTextLayout()">Read Data Streams</button>
        <div id="statusBox" class="status">Console Idle...</div>
        <div id="output">Web stream results will display here...</div>
    </div>

    <script>
        async function fetchTextLayout() {
            const url = document.getElementById('urlInput').value;
            const outputDiv = document.getElementById('output');
            const statusDiv = document.getElementById('statusBox');
            
            statusDiv.innerText = "Attempting bridge connection...";
            outputDiv.innerText = "Loading raw site strings...";

            // Cycle through alternative public cross-origin fetch nodes
            const gateways = [
                'https://allorigins.win',
                'https://herokuapp.com'
            ];

            for (let gateway of gateways) {
                try {
                    let target = gateway === 'https://allorigins.win' ? gateway + encodeURIComponent(url) : gateway + url;
                    let response = await fetch(target);
                    if (!response.ok) continue;
                    
                    let data = await response.json();
                    let rawHtml = data.contents;
                    
                    // Parse the raw code and extract ONLY safe readable text blocks
                    let parser = new DOMParser();
                    let doc = parser.parseFromString(rawHtml, 'text/html');
                    
                    // Clean out dynamic script tags that trigger administrative filters
                    let scripts = doc.querySelectorAll('script, style, nav, footer');
                    scripts.forEach(s => s.remove());
                    
                    let cleanText = doc.body.innerText.replace(/^\s*[\r\n]/gm, '\n');
                    
                    statusDiv.innerText = "Data Stream Synced Successfully.";
                    outputDiv.innerText = cleanText;
                    return;
                } catch (e) {
                    console.log("Node node failed, switching pathway...");
                }
            }
            
            statusDiv.innerText = "Direct gateway blocked. Switch to manual browser layout mode.";
            outputDiv.innerHTML = "Your network is actively dropping external developer fetch scripts. <br><br><b>Final Backup Fix:</b> Go to <a href='https://archive.org' target='_blank' style='color:#00ff00;'>Wayback Machine</a> and paste <b>https://eldorado.gg</b> to load the saved marketplace layout completely unblocked.";
        }
    </script>
</body>
</html>
